name: Secretless Windows verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      MOURN_ISOLATED_BUILD: '1'
      MOURN_ENABLE_UPDATER: 'false'
      VITE_API_BASE: https://mourn.bio
      VITE_WS_BASE: https://mourn.bio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Install root dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install aliased Capacitor dependencies
        working-directory: src-capacitor
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare Quasar
        run: node node_modules/@quasar/app-vite/bin/quasar.js prepare
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Application tests
        run: bun run test
      - name: Release tooling tests
        run: bun run test:release
      - name: Build desktop frontend
        run: bun run build:spa:desktop
