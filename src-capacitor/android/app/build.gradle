apply plugin: 'com.android.application'

/* ── Versioning ──────────────────────────────────────────────────────────────
   versionName is READ FROM THE REPO package.json, so the Android app can never
   drift from the desktop release version (currently 1.3.4). versionCode is DERIVED
   from it (major*1000000 + minor*10000 + patch) so every release is automatically
   installable as an update — Android refuses an "update" whose versionCode is not
   strictly higher, which is why a hardcoded 1 blocked updating over an install.

   The field widths matter: between public releases the patch is APPENDED, not
   incremented (1.3.9 -> 1.3.91 -> ... -> 1.3.99 -> 1.3.991), so patch grows past
   two digits. The old major*10000 + minor*100 + patch form wrapped there — 1.3.99
   gave 10399 and 1.3.991 gave 11291, which is LOWER, so Android rejected the
   update as a downgrade. Widening the fields keeps the series monotonic:
   1.3.99 -> 1030099, 1.3.991 -> 1030991, 1.4.0 -> 1040000. */
def mournVersionName = "1.3.5" // fallback if package.json is unavailable
try {
    def pkg = new groovy.json.JsonSlurper().parse(file("${rootDir}/../../package.json"))
    if (pkg.version) {
        mournVersionName = pkg.version.toString()
    }
} catch (Exception ignored) {
    logger.lifecycle("Could not read package.json version; using ${mournVersionName}")
}

def mournVersionCode = { name ->
    def matcher = (name =~ /^(\d+)\.(\d+)\.(\d+)/)
    if (matcher.matches()) {
        return matcher[0][1].toInteger() * 1000000 + matcher[0][2].toInteger() * 10000 + matcher[0][3].toInteger()
    }
    return 1
}

/* ── Release signing ─────────────────────────────────────────────────────────
   Credentials live OUTSIDE the repository, in ~/.mourn-signing/keystore.properties
   (or in MOURN_KEYSTORE_* env vars for CI). If neither is present the release build
   stays unsigned rather than failing, so a plain local build still works.

   WARNING: Android only accepts an update signed with the SAME key as the installed
   app. Losing this keystore means the app can never be updated again — only
   uninstalled and reinstalled. Back it up offline. */
def mournSigningProps = new Properties()
def mournPropsFile = file(System.getenv("MOURN_KEYSTORE_PROPERTIES") ?: "${System.properties['user.home']}/.mourn-signing/keystore.properties")
def mournHasSigning = false
if (mournPropsFile.exists()) {
    mournPropsFile.withInputStream { mournSigningProps.load(it) }
    mournHasSigning = true
} else if (System.getenv("MOURN_KEYSTORE_PATH")) {
    mournSigningProps.setProperty("storeFile", System.getenv("MOURN_KEYSTORE_PATH"))
    mournSigningProps.setProperty("storePassword", System.getenv("MOURN_KEYSTORE_PASSWORD") ?: "")
    mournSigningProps.setProperty("keyAlias", System.getenv("MOURN_KEY_ALIAS") ?: "mourn")
    mournSigningProps.setProperty("keyPassword", System.getenv("MOURN_KEY_PASSWORD") ?: System.getenv("MOURN_KEYSTORE_PASSWORD") ?: "")
    mournHasSigning = true
}

android {
    namespace = "bio.mourn.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "bio.mourn.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode mournVersionCode(mournVersionName)
        versionName mournVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (mournHasSigning) {
            release {
                storeFile file(mournSigningProps.getProperty("storeFile"))
                storePassword mournSigningProps.getProperty("storePassword")
                keyAlias mournSigningProps.getProperty("keyAlias")
                keyPassword mournSigningProps.getProperty("keyPassword")
                /* Sign with ALL schemes, not just v2. AGP defaults to v2-only for
                   minSdk 24, and an APK that verifies under v1+v2+v3 is accepted by
                   the widest range of installers — some OEM package installers
                   (MIUI/HyperOS in particular) reject a v2-only APK with a
                   "conflicts with an existing package" style error. */
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (mournHasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
