name: Feature request
description: Suggest an improvement to the client
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop app
        - Android app
        - Web client
        - Customization / themes
        - Messaging / Vault
        - Accessibility
        - Documentation
        - Other
    validations:
      required: true
